x-shared-env: &shared-env
    APP_NAME: "${APP_NAME}"
    APP_ENV: "${APP_ENV}"
    APP_KEY: "${APP_KEY}"
    APP_DEBUG: "${APP_DEBUG}"
    APP_TIMEZONE: "${APP_TIMEZONE}"
    APP_URL: "${APP_URL}"
    TRUSTED_PROXY: "${TRUSTED_PROXY:-}"
    APP_LOCALE: "${APP_LOCALE}"
    APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE}"
    APP_FAKER_LOCALE: "${APP_FAKER_LOCALE}"
    # Must not be empty: unset ${VAR} becomes "" and Laravel Managers treat that
    # as a real driver name (createDriver("") → ArgumentCountError in queue:work).
    APP_MAINTENANCE_DRIVER: "${APP_MAINTENANCE_DRIVER:-cache}"
    APP_MAINTENANCE_STORE: "${APP_MAINTENANCE_STORE:-redis}"
    BCRYPT_ROUNDS: "${BCRYPT_ROUNDS}"
    LOG_CHANNEL: "${LOG_CHANNEL}"
    LOG_STACK: "${LOG_STACK}"
    LOG_DEPRECATIONS_CHANNEL: "${LOG_DEPRECATIONS_CHANNEL}"
    LOG_LEVEL: "${LOG_LEVEL}"
    DB_CONNECTION: "${DB_CONNECTION}"
    DB_HOST: "${DB_HOST}"
    DB_PORT: "${DB_PORT}"
    DB_DATABASE: "${DB_DATABASE}"
    DB_USERNAME: "${DB_USERNAME}"
    DB_PASSWORD: "${DB_PASSWORD}"
    # SESSION_DRIVER/CACHE_STORE/QUEUE_CONNECTION = Laravel *driver/store* names.
    # SESSION_CONNECTION = Redis *connection* key in config/database.php (default|cache|queue).
    SESSION_DRIVER: redis
    SESSION_LIFETIME: "${SESSION_LIFETIME}"
    SESSION_ENCRYPT: "${SESSION_ENCRYPT}"
    SESSION_PATH: "${SESSION_PATH}"
    SESSION_DOMAIN: "${SESSION_DOMAIN}"
    SESSION_CONNECTION: "${SESSION_CONNECTION:-default}"
    BROADCAST_CONNECTION: "${BROADCAST_CONNECTION}"
    FILESYSTEM_DISK: "${FILESYSTEM_DISK}"
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    CACHE_PREFIX: "${CACHE_PREFIX}"
    MEMCACHED_HOST: "${MEMCACHED_HOST}"
    REDIS_CLIENT: "${REDIS_CLIENT:-phpredis}"
    REDIS_HOST: redis
    REDIS_PASSWORD: "${REDIS_PASSWORD}"
    REDIS_PORT: 6379
    REDIS_DB: "${REDIS_DB:-0}"
    MAIL_MAILER: "${MAIL_MAILER}"
    MAIL_HOST: "${MAIL_HOST}"
    MAIL_PORT: "${MAIL_PORT}"
    MAIL_USERNAME: "${MAIL_USERNAME}"
    MAIL_PASSWORD: "${MAIL_PASSWORD}"
    MAIL_ENCRYPTION: "${MAIL_ENCRYPTION}"
    MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
    MAIL_FROM_NAME: "${MAIL_FROM_NAME}"
    FILAMENT_FILESYSTEM_DISK: "${FILAMENT_FILESYSTEM_DISK}"
    AWS_ENDPOINT: "${AWS_ENDPOINT}"
    AWS_URL: "${AWS_URL}"
    AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
    AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"
    AWS_BUCKET: "${AWS_BUCKET}"
    AWS_USE_PATH_STYLE_ENDPOINT: "${AWS_USE_PATH_STYLE_ENDPOINT}"
    VITE_APP_NAME: "${VITE_APP_NAME}"

# uid/gid 1000 = octane user in the image. Without this, tmpfs mounts are
# root-owned and artisan/supervisord cannot write under read_only rootfs.
x-app-tmpfs: &app-tmpfs
    - /tmp:noexec,nosuid,size=50m,uid=1000,gid=1000,mode=1777
    - /run:noexec,nosuid,size=10m,uid=1000,gid=1000,mode=0755
    - /var/log/supervisor:nosuid,size=20m,uid=1000,gid=1000,mode=0750
    - /var/www/html/storage/logs:nosuid,size=50m,uid=1000,gid=1000,mode=1777
    - /var/www/html/storage/framework/sessions:nosuid,size=10m,uid=1000,gid=1000,mode=1777
    - /var/www/html/storage/framework/cache:nosuid,size=10m,uid=1000,gid=1000,mode=1777
    - /var/www/html/storage/framework/views:nosuid,size=64m,uid=1000,gid=1000,mode=1777
    - /var/www/html/bootstrap/cache:nosuid,size=10m,uid=1000,gid=1000,mode=1777

services:
    app:
        image: ghcr.io/bphndigitalservice/fungsionalpro:latest
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8000}:8000"
        volumes:
            - upload_data:/var/tmp
            - ./php-ini-restrictions.ini:/usr/local/etc/php/conf.d/99-restrictions.ini:ro
            - ./php.ini:/usr/local/etc/php/conf.d/99-octane.ini:ro
            - ./start-container:/usr/local/bin/start-container:ro
            - ./octane/Swoole/supervisord.swoole.conf:/etc/supervisor/conf.d/supervisord.swoole.conf:ro
        tmpfs: *app-tmpfs
        read_only: true
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - app_network
        environment:
            <<: *shared-env
            CONTAINER_MODE: http
            OCTANE_SERVER: "${OCTANE_SERVER:-swoole}"
            OCTANE_WORKERS: "${OCTANE_WORKERS:-2}"
            OCTANE_MAX_REQUESTS: "${OCTANE_MAX_REQUESTS:-500}"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
        deploy:
            resources:
                limits:
                    cpus: '2.0'
                    memory: 1G
                reservations:
                    cpus: '0.5'
                    memory: 256M

    worker:
        image: ghcr.io/bphndigitalservice/fungsionalpro:latest
        restart: unless-stopped
        volumes:
            - upload_data:/var/tmp
            - ./start-container:/usr/local/bin/start-container:ro
        tmpfs: *app-tmpfs
        read_only: true
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - app_network
        environment:
            <<: *shared-env
            CONTAINER_MODE: worker
            # Keep low: each queue:work process holds a full Laravel boot (~80–150M).
            WORKER_NUMPROCS: "${WORKER_NUMPROCS:-2}"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 512M
                reservations:
                    cpus: '0.25'
                    memory: 128M

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        # volatile-lru: only evict keys with TTL (cache/session). Protects queue lists.
        # 512mb data + AOF overhead needs a container limit above maxmemory.
        command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru --requirepass "${REDIS_PASSWORD}"
        volumes:
            - redis_data:/data
        networks:
            - app_network
        environment:
            REDIS_PASSWORD: "${REDIS_PASSWORD}"
        healthcheck:
            test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli -h 127.0.0.1 ping | grep -q PONG"]
            interval: 5s
            timeout: 3s
            retries: 5
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 640M
                reservations:
                    cpus: '0.1'
                    memory: 128M

volumes:
    upload_data:
    redis_data:

networks:
    app_network:
        driver: bridge