[PHP]
post_max_size = 100M
upload_max_filesize = 100M
expose_php = 0
realpath_cache_size = 16M
realpath_cache_ttl = 360
max_input_time = 30
register_argc_argv = 0

[Opcache]
opcache.enable = 1
opcache.enable_cli = 1
; Sized for a 1G app container: leave room for Swoole workers + request memory.
opcache.memory_consumption = 128
opcache.use_cwd = 0
opcache.max_file_size = 0
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.file_update_protection = 0
opcache.interned_strings_buffer = 16
opcache.file_cache =
opcache.file_cache_only = 0

[JIT]
; Small buffer — full 128M JIT + 256M opcache was starving the 1G container.
opcache.jit_buffer_size = 32M
opcache.jit = tracing
opcache.jit_prof_threshold = 0.001
opcache.jit_max_root_traces = 1024
opcache.jit_max_side_traces = 128

[zlib]
; Prefer reverse-proxy compression; PHP zlib burns CPU on Filament HTML.
zlib.output_compression = Off
