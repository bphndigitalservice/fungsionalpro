name: Docker Build and Publish

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_run:
    workflows: ["Release"]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  resolve-release:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      version_tag: ${{ steps.resolve.outputs.version_tag }}
    steps:
      - name: Fetch tags for release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version tag at release head SHA
        id: resolve
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          git fetch --tags --force
          TAG="$(git tag --list 'v*' --points-at "$HEAD_SHA" | sort -V | tail -n1)"
          if [ -z "$TAG" ]; then
            echo "No v* tag points at $HEAD_SHA; skipping Docker build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found release tag $TAG at $HEAD_SHA."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "version_tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

  build-and-push-image:
    needs: resolve-release
    if: |
      always() && (
        github.event_name != 'workflow_run' ||
        (needs.resolve-release.result == 'success' && needs.resolve-release.outputs.should_build == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && needs.resolve-release.outputs.version_tag || github.ref }}
          fetch-depth: 0

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_run' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy vulnerability scanner (threshold check)
        if: github.event_name == 'push' || github.event_name == 'workflow_run'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

      - name: Generate SBOM
        if: github.event_name == 'push' || github.event_name == 'workflow_run'
        uses: anchore/sbom-action@v0.17.9
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_run'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
